on:
  pull_request:
    - workflows: [verify]
      filter:
        source_branches: ["**"]
        target_branches: ["trunk"]
  push:
    - workflows: [verify]
      filter:
        branches: ["trunk"]

workflows:
  verify:
    tasks:
      - name: verify-vibecloud
        cubes:
          - name: test-package
            image:
              name: node:26-bookworm
              entrypoint: ""
            script:
              - |
                set -eu
                pnpm_version="$(node -p "require('./package.json').packageManager.split('@').at(-1)")"
                npm install --global "pnpm@${pnpm_version}"
                pnpm install --frozen-lockfile
                pnpm release:check
